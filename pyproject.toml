[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-trading-agent"
version = "0.1.0"
description = "Reinforcement learning agent for stock trading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2.40",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "tensorboard>=2.14",
    "optuna>=3.5",
    "tqdm>=4.66",
    "ta>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]
