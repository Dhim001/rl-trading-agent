data:
  symbol: AAPL
  symbols:
    - AAPL
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  cache_dir: data/cache
  stats_file: data/feature_stats.json

environment:
  window_size: 20
  initial_cash: 100000.0
  transaction_cost_pct: 0.001
  max_position_pct: 1.0
  reward_scaling: 1.0

risk:
  max_drawdown_pct: 0.15
  stop_loss_pct: 0.05
  position_size_pct: 0.95

training:
  algorithm: PPO
  total_timesteps: 500
  learning_rate: 0.0003
  batch_size: 32
  gamma: 0.99
  seed: 42
  train_split: 0.8
  eval_freq: 100
  save_freq: 250
  log_dir: runs
  model_dir: models

backtest:
  benchmark_symbol: SPY

paper_trading:
  enabled: true
  interval_seconds: 30
  state_file: paper/portfolio_state.json
  log_file: paper/trades.log
  cache_dir: data/cache
  max_iterations: 1

tuning:
  n_trials: 1
  timesteps_per_trial: 300
  study_name: rl_trading_agent_smoke
  study_dir: tuning
  learning_rate_range: [0.0001, 0.0005]
  gamma_range: [0.98, 0.995]
  batch_size_options: [32]
  window_size_options: [20]
