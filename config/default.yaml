data:
  symbol: AAPL
  symbols:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
  start_date: "2018-01-01"
  end_date: "2024-12-31"
  cache_dir: data/cache
  stats_file: data/feature_stats.json

environment:
  window_size: 30
  initial_cash: 100000.0
  transaction_cost_pct: 0.001
  max_position_pct: 1.0
  reward_scaling: 1.0

risk:
  max_drawdown_pct: 0.15
  stop_loss_pct: 0.05
  position_size_pct: 0.95

training:
  algorithm: PPO
  total_timesteps: 200000
  learning_rate: 0.0003
  batch_size: 64
  gamma: 0.99
  seed: 42
  train_split: 0.8
  eval_freq: 10000
  save_freq: 25000
  log_dir: runs
  model_dir: models

backtest:
  benchmark_symbol: SPY

paper_trading:
  enabled: true
  interval_seconds: 300
  state_file: paper/portfolio_state.json
  log_file: paper/trades.log
  cache_dir: data/cache
  max_iterations: null

tuning:
  n_trials: 20
  timesteps_per_trial: 50000
  study_name: rl_trading_agent
  study_dir: tuning
  learning_rate_range: [0.00001, 0.001]
  gamma_range: [0.95, 0.999]
  batch_size_options: [32, 64, 128]
  window_size_options: [20, 30, 40]
